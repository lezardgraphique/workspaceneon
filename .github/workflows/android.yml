# Builds the Google Play app (android/, Trusted Web Activity) and keeps the
# .aab to download from the run's « Artifacts ». Manual (Actions → Android →
# Run workflow) or on a change in android/. Signed with the upload key from
# the repository secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD); without them the bundle is
# unsigned (a test that the project builds). See android/README.md.
name: Android

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version affichée sur Google Play (ex. 1.0.1)'
        required: false
        default: '1.0.0'
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # The runner already has the Android SDK: only API 36 is added.
      - name: SDK Android 36
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Clé d'envoi
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de clé d'envoi dans les secrets : le bundle n'est pas signé."
          fi
      - name: Bundle (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ inputs.versionName || '1.0.0' }}
      - uses: actions/upload-artifact@v7
        with:
          name: neon-sandbox-${{ inputs.versionName || '1.0.0' }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
