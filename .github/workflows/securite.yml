name: Sécurité
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # chaque lundi, même sans modification du code
permissions:
  contents: read
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Échoue dès qu'une faille de gravité haute ou critique est connue.
      - run: pnpm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npx vite build
